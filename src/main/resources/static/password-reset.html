<!doctype html>
<html lang="de"><head><script src="/theme-init.js?v=20261026-theme2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title data-i18n="pr.title">Passwort zurücksetzen · Corporate LC Manager</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css?v=20261026-theme2"><style>.login-card form.hidden{display:none}</style></head>
<body class="login-page"><main class="login-card"><span class="brand">LC</span><h1 id="resetTitle" data-i18n="pr.h1">Passwort vergessen?</h1>
<form id="resetRequestForm"><p data-i18n="pr.requestText">Geben Sie Ihren Benutzernamen und die im Profil hinterlegte E-Mail-Adresse ein.</p><label data-i18n="login.username">Benutzername<input name="username" required maxlength="100" autocomplete="username"></label><label data-i18n="pr.email">E-Mail<input name="email" type="email" required maxlength="255" autocomplete="email"></label><button type="submit" data-i18n="pr.requestSubmit">Reset-Link anfordern</button></form>
<form id="resetCompleteForm" class="hidden"><p data-i18n="pr.completeText">Der Link ist 30 Minuten gültig. Ihre Zwei-Faktor-Anmeldung bleibt aktiv.</p><label data-i18n="pr.newPassword">Neues Passwort<input name="password" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label><label data-i18n="pr.repeat">Passwort wiederholen<input name="confirmation" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label><small data-i18n="pr.rules">Mindestens 10 Zeichen mit Großbuchstaben, Kleinbuchstaben und einer Zahl.</small><button type="submit" data-i18n="pr.completeSubmit">Passwort ändern</button></form>
<p id="resetMessage" role="status" aria-live="polite"></p><p><a href="/login.html" data-i18n="pr.toLogin">Zur Anmeldung</a></p></main><script src="/prelogin-language.js?v=20261022-2"></script><script src="/password-reset.js?v=20261022-1"></script></body></html>
