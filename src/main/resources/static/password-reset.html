<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Passwort zurücksetzen · Corporate LC Manager</title><link rel="stylesheet" href="/styles.css"><style>.login-card form.hidden{display:none}</style><link rel="stylesheet" href="/theme.css?v=20261006-1"></head>
<body class="login-page"><main class="login-card"><span class="brand">LC</span><h1 id="resetTitle">Passwort vergessen?</h1>
<form id="resetRequestForm"><p>Geben Sie Ihren Benutzernamen und die im Profil hinterlegte E-Mail-Adresse ein.</p><label>Benutzername<input name="username" required maxlength="100" autocomplete="username"></label><label>E-Mail<input name="email" type="email" required maxlength="255" autocomplete="email"></label><button type="submit">Reset-Link anfordern</button></form>
<form id="resetCompleteForm" class="hidden"><p>Der Link ist 30 Minuten gültig. Ihre Zwei-Faktor-Anmeldung bleibt aktiv.</p><label>Neues Passwort<input name="password" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label><label>Passwort wiederholen<input name="confirmation" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label><small>Mindestens 10 Zeichen mit Großbuchstaben, Kleinbuchstaben und einer Zahl.</small><button type="submit">Passwort ändern</button></form>
<p id="resetMessage" role="status" aria-live="polite"></p><p><a href="/login.html">Zur Anmeldung</a></p></main><script src="/password-reset.js?v=20261005-1"></script></body></html>
