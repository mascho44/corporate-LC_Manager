spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lcmanager}
    username: ${DB_USER:lcmanager}
    password: ${DB_PASSWORD:lcmanager}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
app:
  upload:
    antivirus-enabled: ${UPLOAD_ANTIVIRUS_ENABLED:false}
    antivirus-host: ${UPLOAD_ANTIVIRUS_HOST:clamav}
    antivirus-port: ${UPLOAD_ANTIVIRUS_PORT:3310}
  messaging:
    outbox-interval-ms: ${OUTBOX_INTERVAL_MS:5000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
  mail:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}
  security:
    public-base-url: ${PUBLIC_BASE_URL:https://lc.example.com}
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}
  initial-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    reset-password: ${ADMIN_RESET_PASSWORD:false}
