spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lcmanager}
    username: ${DB_USER:lcmanager}
    password: ${DB_PASSWORD:lcmanager}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
app:
  security:
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}
  initial-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    reset-password: ${ADMIN_RESET_PASSWORD:false}
