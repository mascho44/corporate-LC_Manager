spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lcmanager}
    username: ${DB_USER:lcmanager}
    password: ${DB_PASSWORD:lcmanager}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Migrationen laufen mit der Besitzerrolle; die Laufzeit kann eine eingeschraenkte Rolle nutzen (docs/datenbank-rollen.md).
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:${DB_USER:lcmanager}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:lcmanager}}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
app:
  upload:
    antivirus-enabled: ${UPLOAD_ANTIVIRUS_ENABLED:false}
    antivirus-host: ${UPLOAD_ANTIVIRUS_HOST:clamav}
    antivirus-port: ${UPLOAD_ANTIVIRUS_PORT:3310}
  messaging:
    outbox-interval-ms: ${OUTBOX_INTERVAL_MS:5000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
  mail:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}
  security:
    public-base-url: ${PUBLIC_BASE_URL:https://lc.example.com}
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}
  ebics:
    encryption-key: ${EBICS_ENCRYPTION_KEY:}
    allowed-hosts: ${EBICS_ALLOWED_HOSTS:}
    message-types: ${EBICS_MESSAGE_TYPES:MT700,MT707,MT710,MT760}
  intake:
    folder-root: ${INTAKE_FOLDER_ROOT:/data/intake}
    settle-seconds: ${INTAKE_SETTLE_SECONDS:10}
    poll-ms: ${INTAKE_POLL_MS:30000}
    encryption-key: ${INTAKE_ENCRYPTION_KEY:}
    allowed-hosts: ${INTAKE_ALLOWED_HOSTS:}
  initial-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    reset-password: ${ADMIN_RESET_PASSWORD:false}

lc:
  tenant:
    # Plattformadministratoren erhalten in Mandanten keine Administrator-/Verwaltungsrechte. Nur der synthetische Abnahmelauf mit einer einzigen Identitaet setzt false.
    separate-platform-admin: ${LC_SEPARATE_PLATFORM_ADMIN:true}
  ai:
    # Optionale KI-Vorschlaege, anbieterunabhaengig. Aus, solange nicht ausdruecklich aktiviert; zusaetzlich je Mandant einzuschalten.
    # Der Dokumenttext geht ausschliesslich an base-url. provider: ollama (lokal) oder openai-compatible (Mistral, OpenAI, vLLM, LM Studio, Gateways ...).
    enabled: ${LC_AI_ENABLED:false}
    provider: ${LC_AI_PROVIDER:ollama}
    base-url: ${LC_AI_BASE_URL:http://localhost:11434}
    model: ${LC_AI_MODEL:qwen2.5:3b}
    api-key: ${LC_AI_API_KEY:}
    api-key-file: ${LC_AI_API_KEY_FILE:}
    timeout-seconds: ${LC_AI_TIMEOUT_SECONDS:240}
    # Eigene Konfiguration der Mandanten (Oberflaeche unter Mandant -> KI-Vorschlaege): nur Hosts aus dieser Liste, nur HTTPS, keine internen Adressen.
    allowed-hosts: ${LC_AI_ALLOWED_HOSTS:}
    # true erlaubt lokale Endpunkte (z. B. Ollama); nur bewusst setzen.
    allow-local: ${LC_AI_ALLOW_LOCAL:false}
    # Schluessel zum Verschluesseln der Mandanten-API-Schluessel; faellt auf EBICS_ENCRYPTION_KEY zurueck.
    encryption-key: ${LC_AI_ENCRYPTION_KEY:${EBICS_ENCRYPTION_KEY:}}
  audit:
    # Aufbewahrungsfrist des Audit-Protokolls in Jahren (Richtwert fuer die Revision; es wird nie automatisch geloescht).
    retention-years: ${AUDIT_RETENTION_YEARS:10}
