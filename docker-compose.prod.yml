name: corporate-lc-manager

services:
  app:
    build:
      context: .
    image: corporate-lc-manager:0.5.0
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lcmanager
      DB_USER: lcmanager
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD muss gesetzt sein}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu+eng}
      EBICS_ENCRYPTION_KEY: ${EBICS_ENCRYPTION_KEY:-}
      EBICS_ALLOWED_HOSTS: ${EBICS_ALLOWED_HOSTS:-}
      EBICS_MESSAGE_TYPES: ${EBICS_MESSAGE_TYPES:-MT700,MT707,MT710,MT760}
      SESSION_COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
      OMP_THREAD_LIMIT: "1"
      UPLOAD_ANTIVIRUS_ENABLED: ${UPLOAD_ANTIVIRUS_ENABLED:-false}
      UPLOAD_ANTIVIRUS_HOST: ${UPLOAD_ANTIVIRUS_HOST:-clamav}
      UPLOAD_ANTIVIRUS_PORT: ${UPLOAD_ANTIVIRUS_PORT:-3310}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY muss gesetzt sein}
      AUDIT_RETENTION_YEARS: ${AUDIT_RETENTION_YEARS:-10}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL muss die öffentliche HTTPS-Adresse enthalten}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - lc-manager-app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lcmanager
      POSTGRES_USER: lcmanager
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
    volumes:
      - lc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcmanager -d lcmanager"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: docker compose --profile antivirus up -d  (zusammen mit UPLOAD_ANTIVIRUS_ENABLED=true)
  clamav:
    profiles: ["antivirus"]
    image: clamav/clamav:1.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g
    volumes:
      - lc-clamav:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?PROXY_NETWORK muss das vorhandene Proxy-Netzwerk benennen}

volumes:
  lc-postgres:
  lc-clamav:
